name: live scanner

on:
  schedule:
    - cron: "*/30 * * * *"     # GitHub may start scheduled runs late; the scanner catches up on its own
  workflow_dispatch: {}          # "Run workflow" button for manual runs

concurrency:
  group: scanner                 # only one scanner at a time; the next scheduled run waits its turn
  cancel-in-progress: false

permissions:
  contents: write                # lets the job commit data/ back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355         # GitHub's hard limit is 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Scan
        env:
          GIT_COMMIT: "1"
        run: python -m scanner.run
